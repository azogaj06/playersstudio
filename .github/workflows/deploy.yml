# Build the site and publish it to GitHub Pages on every push to main.
# Live at: https://playersstudio.ca/
#
# Publishes by force-pushing dist/ to the gh-pages branch, which GitHub
# Pages serves automatically. (The artifact-based deploy-pages flow needs
# the Pages source flipped to "GitHub Actions" in repo settings first —
# the branch flow works with zero settings.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Domain root, so no DEPLOY_BASE. SITE_URL feeds sitemap.xml/robots.txt
          SITE_URL: https://playersstudio.ca
      - name: Publish dist/ to the gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
